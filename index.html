<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="stylesheet.css">
  
  <title>Frontend Mentor | QR code component</title>

</head>
<body>
  <div class="container">
    <main class="card">
      <img src="images/image-qr-code.png" alt="QR code to frontendmentor.io">

      <article class="card-message">
        <h1 class="lead">Improve your front-end skills by building projects</h1>
        <p class="small">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </article>

    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/swaandaFJ" target="_blank">swaandaFJ</a>.
    </footer>
  </div>
  
</body>
</html>
